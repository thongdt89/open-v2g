name: Host SIL

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-sil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / C11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure host/SIL build
        run: >-
          cmake -S . -B build-ci
          -DOPENV2G_BUILD_TESTS=ON
          -DOPENV2G_BUILD_EXAMPLES=ON
          -DOPENV2G_WARNINGS_AS_ERRORS=ON

      - name: Build host/SIL artifacts
        run: cmake --build build-ci --config Debug --parallel

      - name: Run host/SIL tests
        run: cmake -E chdir build-ci ctest -C Debug --output-on-failure

  sap-exi-candidate:
    name: Linux / pinned EXI codecs and DC sessions
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Check out pinned generated-code candidate
        uses: actions/checkout@v4
        with:
          repository: EVerest/libcbv2g
          ref: 03350be048b35b179905129005a97144a4bdcf93
          path: out/deps/libcbv2g
          persist-credentials: false
      - name: Check out independent test-only codec
        uses: actions/checkout@v4
        with:
          repository: Martin-P/OpenV2G
          ref: 733d4f43cb6579c705d59c7386786ce12a0a0026
          path: out/deps/openv2g-oracle
          persist-credentials: false
      - name: Configure SAP candidate and host tests
        run: >-
          cmake -S . -B build-sap
          -DCMAKE_BUILD_TYPE=Debug
          -DOPENV2G_ENABLE_CBV2G_SAP_POC=ON
          -DOPENV2G_CBV2G_SOURCE_DIR=${{ github.workspace }}/out/deps/libcbv2g
          -DOPENV2G_ORACLE_SOURCE_DIR=${{ github.workspace }}/out/deps/openv2g-oracle
          -DOPENV2G_WARNINGS_AS_ERRORS=ON
      - name: Build and test host candidate
        run: |
          cmake --build build-sap --parallel
          ctest --test-dir build-sap --output-on-failure
      - name: Configure generated decoder sanitizers
        run: >-
          cmake -S . -B build-sap-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DOPENV2G_ENABLE_CBV2G_SAP_POC=ON
          -DOPENV2G_CBV2G_SOURCE_DIR=${{ github.workspace }}/out/deps/libcbv2g
          -DOPENV2G_BUILD_SIMULATION=ON
          -DOPENV2G_BUILD_EXAMPLES=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Run codec corpora and socket sessions with sanitizers
        run: |
          cmake --build build-sap-sanitize --parallel
          ctest --test-dir build-sap-sanitize --output-on-failure
